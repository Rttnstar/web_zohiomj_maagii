<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"><title>CV маягт</title></head>
<body><h2>Оюутны CV мэдээлэл</h2>
<form action="success.html" method="get">
  <label>Оюутны код: <input type="text" name="code" required></label><br><br>
  <label>Овог, нэр: <input type="text" name="name" required></label><br><br>
  <label>Нууц үг: <input type="password" name="password"></label><br><br>
  <label>Төрсөн огноо: <input type="date" name="birth"></label><br><br>
  <label>Хүйс: <input type="radio" name="gender" value="Эр"> Эр <input type="radio" name="gender" value="Эм"> Эм</label><br><br>
  <label>Имэйл: <input type="email" name="email"></label><br><br>
  <label>Програмчлалын хэл:<select name="skill"><option>HTML</option><option>CSS</option><option>JavaScript</option></select></label><br><br>
  <label>Хаяг:<br><textarea name="address" rows="4" cols="40"></textarea></label><br><br>
  <label>Хобби: <input type="checkbox" name="hobby" value="Ном"> Ном <input type="checkbox" name="hobby" value="Спорт"> Спорт</label><br><br>
  <label>Зураг: <input type="file" name="photo"></label><br><br>
  <input type="reset" value="Цэвэрлэх"> <input type="submit" value="Илгээх">
</form></body></html>

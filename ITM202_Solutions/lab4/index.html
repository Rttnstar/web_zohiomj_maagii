<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"><title>Мультимедиа блог</title><style>body{font-family:Arial;max-width:1000px;margin:auto;background:#f4f7fb}header,footer{background:#234b70;color:white;padding:18px}main{display:flex;gap:20px;padding:20px;background:white}.content{flex:1}.side{width:300px}section{border:1px solid #ccd6e0;padding:15px;margin-bottom:15px}canvas{border:1px solid #555;background:#eef8ff}svg{border:1px solid #555;background:#fff8e1}</style></head>
<body><header><h1>Миний мультимедиа блог</h1><audio controls><source src="media/my-audio.mp3" type="audio/mpeg">Энд өөрийн дууны файл оруулна уу.</audio></header>
<main><div class="content"><section><h2>Миний видео</h2><video width="100%" controls><source src="media/my-video.mp4" type="video/mp4">Таны browser video дэмжихгүй байна.</video><p>Өөрийн 3-4 секундийн видеогоо <code>media/my-video.mp4</code> нэрээр хадгална.</p></section><section><h2>Canvas зураг</h2><canvas id="canvas" width="500" height="250"></canvas></section></div>
<aside class="side"><section><h2>SVG зураг</h2><svg width="280" height="220" viewBox="0 0 280 220"><rect width="280" height="220" fill="#bfe7ff"/><circle cx="220" cy="45" r="28" fill="#ffd447"/><polygon points="0,180 90,90 170,180" fill="#719b74"/><polygon points="90,180 180,80 280,180" fill="#48745a"/><rect x="105" y="135" width="70" height="55" fill="#d88952"/><polygon points="95,135 185,135 140,95" fill="#a84e4e"/><rect x="132" y="155" width="16" height="35" fill="#5b4436"/></svg></section></aside></main><footer>ITM202 - HTML мультимедиа</footer>
<script>const c=document.getElementById('canvas'),x=c.getContext('2d');x.fillStyle='#8bd3dd';x.fillRect(0,0,500,250);x.fillStyle='#ffd447';x.beginPath();x.arc(410,55,35,0,Math.PI*2);x.fill();x.fillStyle='#6d9b70';x.beginPath();x.moveTo(0,220);x.lineTo(160,80);x.lineTo(300,220);x.fill();x.fillStyle='#bd6b4b';x.fillRect(210,145,100,75);x.fillStyle='#8b3d3d';x.beginPath();x.moveTo(195,145);x.lineTo(325,145);x.lineTo(260,90);x.fill();x.fillStyle='#654332';x.fillRect(250,175,22,45);</script></body></html>
